# nginx cho thcsngason.online → container nga-son-hoc-tap (127.0.0.1:3210)
# Cài: cp vào /etc/nginx/sites-available/thcsngason.online, ln -s sang sites-enabled, nginx -t && systemctl reload nginx
# Chứng chỉ: certbot --nginx -d thcsngason.online -d www.thcsngason.online --no-redirect
#   (không để certbot tự chuyển 80→443: Cloudflare đứng trước, bật "Always Use HTTPS" ở Cloudflare thay vào đó)

upstream nga_son_hoc_tap {
    server 127.0.0.1:3210;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # Tạm dùng chứng chỉ tự ký cho tới khi certbot cấp chứng chỉ thật (certbot sẽ thay 2 dòng ssl_certificate)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    server_name thcsngason.online www.thcsngason.online;

    # nhập câu hỏi từ CSV (≤ 3 MB JSON)
    client_max_body_size 5M;

    # IP thật của người dùng khi đi qua Cloudflare
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Lớp học trực tiếp: Server-Sent Events — không đệm, giữ kết nối lâu
    location ~ ^/api/live/[0-9]+/stream$ {
        proxy_pass http://nga_son_hoc_tap;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://nga_son_hoc_tap;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare luôn phục vụ người dùng qua HTTPS → báo cho app là https (cookie Secure, link OAuth đúng)
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
